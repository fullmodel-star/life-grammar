(function(){
  var K='lock_925lifegrammar_pw', $=function(i){return document.getElementById(i)};
  function b2b(b){var s=atob(b),a=new Uint8Array(s.length);for(var i=0;i<s.length;i++)a[i]=s.charCodeAt(i);return a.buffer}
  async function open_(pw){
    var E=window.__LOCK;
    var km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
    var k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b2b(E.salt),iterations:E.iter,hash:'SHA-256'},

  function boot(html){
    /* ⚠️ 不要用 document.open()/write() 把 App 寫回本頁 —— 實測會炸。
       原因不是 jsdom 的毛病，是這個做法本身：document.write 發生在頁面「載入完成之後」，
       整份文件的生命週期事件早就放過了，而 App 的啟動碼長這樣：
           if(document.readyState==='loading') addEventListener('DOMContentLoaded',mount); else mount();

         實測噴 "Cannot access 'esc' before initialization"（TDZ）。

       改用 iframe srcdoc：
         · 全新文件 → readyState 正常走 loading→interactive→complete，解析順序正確
         · srcdoc 繼承父層 origin → **localStorage 完全共用，學習進度一格都不會掉**
         · srcdoc 的相對網址對父層 base 解析 → sw.js / css / icon 都找得到 */
    var f=document.createElement('iframe');
    f.setAttribute('title','app');
    f.style.cssText='position:fixed;inset:0;width:100%;height:100%;border:0;margin:0;display:block';
    document.documentElement.style.cssText='margin:0;padding:0;height:100%';
    document.body.style.cssText='margin:0;padding:0;height:100%;overflow:hidden;background:#141E2B';
